[tool.black]
line-length = 80
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311'] #, 'py312'

# Config file for the isort python module.
# This is used to enforce import sorting standards.
#
# https://pycqa.github.io/isort/docs/configuration/options.html
[tool.isort]
# Be compatible with `black` since it also matches what we want.
profile = 'black'

line_length = 80
length_sort = false
force_single_line = true
lines_after_imports = 2
from_first = false
case_sensitive = false
force_sort_within_sections = true
order_by_type = false

# Ignore generated files.
extend_skip_glob = '*_pb2.py'

# Allow importing multiple classes on a single line from these modules.
# https://google.github.io/styleguide/pyguide#s2.2-imports
single_line_exclusions = ['abc', 'collections.abc', 'typing']

[tool.pytest.ini_options]
addopts = [
    "--durations=5",
    "--durations-min=1.0",
    "--strict-markers",
    "--numprocesses=auto",
    # Currently the test suite doesn't seem to get faster with more threads,
    # so cap it here for now since there's a startup cost for every one.
    "--maxprocesses=32",
]
markers = """
    skip_cq: Skip tests in the CQ. Should be rarely used!
    e2e: Hermetic end-to-end tests (tests/e2e/). Deselect with -m 'not e2e'.
"""

# https://pyrefly.org/en/docs/configuration/
[tool.pyrefly]
project-includes = [
    "repo",
    "run_tests",
    "**/*.py*",
]
# NB: Do not add more modules here.  We need to shrink this list.
